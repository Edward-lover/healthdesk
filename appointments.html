<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Appointments - HealthDesk</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#2e8b57"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <header class="top-header">

        <div class="header-logo">

            <img
                src="icon-192.png"
                alt="HealthDesk Logo"
            >

        </div>


        <div class="header-title">

            <h1>HEALTHDESK</h1>

            <p>School Clinic</p>

        </div>

    </header>


    <nav class="page-nav">

        <a href="dashboard.html">
            Home
        </a>

        <a
            href="appointments.html"
            class="active"
        >
            My Appointment
        </a>

        <button
            id="logoutBtn"
            type="button"
        >
            Log Out
        </button>

    </nav>


    <main class="appointments-container">

        <div class="section-title">

            <h1>
                My Appointments
            </h1>

            <a
                href="appointment.html"
                class="primary-btn"
            >
                + New Appointment
            </a>

        </div>


        <div id="appointmentsList">

            <div class="empty-dashboard">

                <span>
                    📅
                </span>

                <p>
                    Loading appointments...
                </p>

            </div>

        </div>

    </main>


    <footer>

        <p>
            © 2026 HealthDesk - School Clinic
        </p>

    </footer>


    <script src="script.js"></script>


    <script>

        if ("serviceWorker" in navigator) {

            navigator.serviceWorker.register(
                "./service-worker.js"
            );

        }

    </script>

</body>

</html>
